<!DOCTYPE html>
<html lang="tr" class="light" data-theme="light">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAFAF9">
  <meta name="description" content="Linguosphere — Elite Linguistic AI English Learning Platform">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">

  <title>Linguosphere — Master English</title>

  <!-- Preconnect Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>

  <!-- Compiled Production Tailwind CSS -->
  <link rel="stylesheet" href="css/tailwind.output.css?v=v6-game-theme-fix">

  <style>
    html {
      overflow-x: hidden;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    body {
      overflow-x: hidden;
      overflow-y: auto;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
    }
    /* Sleek visible scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(79, 70, 229, 0.25);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(79, 70, 229, 0.45);
    }
  </style>

  <!-- Legacy & Component Styles -->
  <link rel="stylesheet" href="css/main.css?v=v6-game-theme-fix">
  <link rel="stylesheet" href="css/layout.css?v=v6-game-theme-fix">
  <link rel="stylesheet" href="css/components.css?v=v6-game-theme-fix">
  <link rel="stylesheet" href="css/animations.css?v=v6-game-theme-fix">
  <link rel="stylesheet" href="css/screens.css?v=v6-game-theme-fix">
  <link rel="stylesheet" href="css/responsive.css?v=v6-game-theme-fix">
</head>
<body class="bg-background font-body-md text-on-surface antialiased min-h-screen relative selection:bg-primary-fixed selection:text-primary">
  
  <!-- Ambient Mesh Background Glows (Hardware Accelerated) -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0 opacity-60" style="transform: translateZ(0); will-change: transform;">
    <div class="absolute -top-[10%] left-[10%] w-[450px] h-[450px] rounded-full bg-mesh-glow-indigo blur-[70px] opacity-40"></div>
    <div class="absolute top-[35%] -right-[5%] w-[450px] h-[450px] rounded-full bg-mesh-glow-emerald blur-[80px] opacity-30"></div>
    <div class="absolute -bottom-[10%] left-[25%] w-[420px] h-[420px] rounded-full bg-mesh-glow-amber blur-[70px] opacity-30"></div>
  </div>

  <!-- App Root Shell -->
  <div id="app">
    <!-- JavaScript Dynamic Navigation & Screens -->
  </div>

  <!-- Tesseract.js OCR Engine -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script type="module" src="js/app.js?v=v5-layout-fix"></script>
</body>
</html>
